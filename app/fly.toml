# TwinKey — Fly.io, scale to zero.
#
# Why Fly and not a serverless platform: the app holds a websocket to the Portaldot node and parses
# runtime metadata on first use. A Worker has no TCP at all, and a lambda charges CPU for the
# cold start of the WASM crypto (measured: 2.3 s per cold invocation). A container is billed for the
# time it exists, and `auto_stop_machines` makes that time only what a request actually needs.
#
# Wake cost after idle: ~1-3 s (full boot, so no stale in-memory state and no dead pooled sockets).
# `/api/ping` is the wake path — it answers from process memory and touches nothing, so a client can
# speculatively fire it while the reader is still on the first screen.

app = "twinkey"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"
  TWINKEY_VERIFIER_URL = "https://twinkey-verifier.kiter0211.workers.dev"

[http_service]
  internal_port = 3000
  force_https = true
  # Measured on this app (2026-11-13, shared-cpu-1x 1GB, sin):
  #   "stop"    -> autostop at 7 min idle, first request after wake 6.84 s  (a Node + Next boot)
  #   "suspend" -> resume from a memory snapshot in about a second, but it restores a process whose
  #                websocket to the chain is already dead. That is the trade this app can afford
  #                *only because* lib/twinkey/chain.ts checks `isConnected` and rebuilds the socket
  #                on the next read, so a resumed machine answers a chain read instead of erroring.
  # Verify that path after any change here: wake a suspended machine, then curl /api/state and read
  # the payload — a resume that returns `WebSocket is not connected` means the rebuild logic regressed.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[vm]]
  # 1GB because the first chain read parses ~2MB of runtime metadata; 512MB is where that gets
  # tight. Idle cost is the rootfs only, so the extra memory is free while nobody is looking.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
